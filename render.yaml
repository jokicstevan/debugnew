services:
  - type: web
    name: grps-routing
    runtime: python
    pythonVersion: "3.12"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --config gunicorn.conf.py --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HERE_API_KEY
        sync: false
      - key: APP_USER
        value: admin
      - key: APP_PASS
        sync: false
      - key: APP_USER2
        value: dispatcher
      - key: APP_PASS2
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: grps-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: grps-redis
          type: redis
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"

