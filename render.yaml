services:
  - type: web
    name: grps-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: grps-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: grps-redis
          property: connectionString
      - key: HERE_API_KEY
        sync: false

  - type: worker
    name: grps-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A tasks worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grps-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: grps-redis
          property: connectionString
      - key: HERE_API_KEY
        sync: false

databases:
  - name: grps-db
    databaseName: grps
    user: grps_user

redis:
  - name: grps-redis
    plan: free
    ipAllowList: []
