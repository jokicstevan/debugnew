services:
  - type: web
    name: grps-routing
    runtime: python
    pythonVersion: "3.12"          # Pin to 3.12 — psycopg2-binary not yet compatible with 3.14
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure random value
      - key: HERE_API_KEY
        sync: false                # Get your free key at developer.here.com
      - key: APP_USER
        value: admin               # Change this to your preferred username
      - key: APP_PASS
        sync: false                # Render will prompt you to set this secretly
      - key: APP_USER2
        value: dispatcher
      - key: APP_PASS2
        sync: false                # Render will prompt you to set this secretly
      - key: DATABASE_URL
        fromDatabase:
          name: grps-db            # Must match the database name below
          property: connectionString

databases:
  - name: grps-db
    plan: free                     # Free tier: 1 GB storage, deleted after 90 days
    # plan: starter                # $7/month: persistent, daily backups, 1 GB storage
    databaseName: grps
    user: grps_user
