services:
  - type: web
    name: grps-frontend
    runtime: static
    staticPublishPath: ./dist
    buildCommand: |
      mkdir -p dist/css dist/js
      BURL="${BACKEND_URL:-}"
      sed "s|%%BACKEND_URL%%|${BURL}|g" templates/index.html > dist/index.html
      sed "s|%%BACKEND_URL%%|${BURL}|g" templates/login.html > dist/login.html
      cp static/css/app.css dist/css/app.css
      cp static/js/app.js dist/js/app.js
    envVars:
      - key: BACKEND_URL
        sync: false   # Paste your Cloudflare tunnel URL here each time it changes
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /
        destination: /index.html
